<style>
:root{--bg:#F4F6FA;--card:#fff;--text:#0B1D35;--sub:#364F6B;--border:#D5DDE8;--gold:#F5A623;--navy:#0B1D35}
@media (prefers-color-scheme: dark){:root{--bg:#0B1D35;--card:#13284A;--text:#F4F6FA;--sub:#C9D6E5;--border:#2C4A73}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.7;padding:24px 16px}

p{color:var(--sub);margin-bottom:12px}
.btn{display:inline-block;margin-top:8px;padding:14px 20px;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:900;text-decoration:none;min-height:44px}
small{display:block;margin-top:20px;font-size:14px;color:var(--sub)}
