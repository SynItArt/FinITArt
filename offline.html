<!DOCTYPE html>
<!-- 보안등급: 공개용 | HeirWise 웹앱 오프라인 안내 v1.0 (2026.10.28) | 제작: HeirWise_Syn Dae Sik -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인터넷 연결이 끊겼어요 — HeirWise</title>
<link rel="icon" type="image/svg+xml" href="/img/brand/heirwise-symbol.svg">
<meta name="theme-color" content="#1B3A6B">
<style>
:root{--bg:#FFFFFF;--ink:#14161A;--ink-2:#4A4F57;--line:#C9CED6;--heir:#1B3A6B;--wise:#7A5C0E;--btn:#1B3A6B;--btn-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--ink:#F2F4F8;--ink-2:#C3C9D3;--line:#3A4458;--heir:#8FB4FF;--wise:#E8C46A;--btn:#8FB4FF;--btn-ink:#0E1420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;font-size:19px;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:40px 20px 56px}
.brand{font-size:16px;font-weight:600;color:var(--ink-2)}
.brand b{font-size:22px;font-weight:800}.brand .h{color:var(--heir)}.brand .w{color:var(--wise)}
h1{font-size:28px;line-height:1.35;margin:28px 0 12px}
p{margin:0 0 16px}
.box{border:2px solid var(--line);border-radius:12px;padding:18px 20px;margin:24px 0}
.box strong{display:block;font-size:20px;margin-bottom:4px}
.big{font-size:24px;font-weight:800}
button{display:block;width:100%;min-height:56px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:800;font-size:20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--wise);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand">SynItArt · <b><span class="h">Heir</span><span class="w">Wise</span></b><sup>™</sup></div>
  <h1>지금 인터넷 연결이 끊겨 있어요</h1>
  <p>와이파이나 데이터가 켜져 있는지 확인한 뒤 아래 버튼을 눌러 주세요. 한 번 열어 본 페이지는 연결 없이도 다시 열릴 수 있어요.</p>
  <button type="button" onclick="location.reload()">다시 연결해 보기</button>
  <div class="box">
    <strong>급하실 때는 전화로</strong>
    <span class="big">010-2088-5383</span><br>
    <span>itart@finitart.com</span>
  </div>
  <p style="font-size:16px;color:var(--ink-2)">상속 기한은 연결이 돌아온 뒤 다시 확인해 주세요. 이 화면에는 계산 결과가 저장되지 않습니다.</p>
</main>
</body>
</html>
