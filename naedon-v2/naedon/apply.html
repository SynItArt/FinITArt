<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>파일럿 신청 · 내돈내가</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="assets/app.css">
<style>
.wz{max-width:720px;margin:0 auto}
.progress{margin:22px 0 6px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;background:var(--surface2);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stepno{font-weight:800;font-size:.95rem;white-space:nowrap}
.q{font-size:1.6rem;line-height:1.35;margin:18px 0 6px;outline:none}
.qhelp{color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:1.1rem;font-weight:700;
  min-height:68px;padding:14px 18px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.opt small{display:block;font-weight:500;font-size:.85rem;color:var(--muted);margin-top:2px}
.opt .mk{flex:none;width:30px;height:30px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.opt.single .mk{border-radius:50%}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:var(--surface2)}
.opt[aria-pressed="true"] .mk,.opt[aria-checked="true"] .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav2{display:flex;gap:12px;margin:24px 0 8px;flex-wrap:wrap}
.nav2 .btn{min-height:60px;font-size:1.1rem;flex:1;min-width:140px}
.phone{font-size:1.8rem;font-weight:800;letter-spacing:.06em;text-align:center;padding:16px}
.drop{border:3px dashed var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.filelist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.filelist li{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem}
.filelist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{width:100%;border-collapse:collapse;font-size:.95rem}
.sum th{width:34%}
.sum td button{margin-top:4px}
.notice{border:3px solid var(--danger);border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--surface)}
.notice strong{color:var(--danger)}
.done{text-align:center;padding:30px 0}
.done .big{font-size:2rem;font-weight:900;margin:8px 0;color:var(--accent);word-break:break-all}
.sending{font-weight:800;font-size:1.1rem}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="index.html">내돈내가 <small>FinitArt · 미수금 셀프 회수 파일럿</small></a>
    <button class="btn-theme" id="themeBtn" type="button" aria-label="밝은 화면과 어두운 화면 전환">밝은 화면</button>
  </div>
  <nav class="wrap nav" aria-label="주요 메뉴">
    <a href="index.html">파일럿 안내</a>
    <a href="apply.html" aria-current="page">파일럿 신청</a>
    <a href="monitor.html">거래처 관리</a>
    <a href="recover.html">회수 작성 도구</a>
    <a href="reserve.html">요금·사전예약</a>
  </nav>
</header>

<main class="wrap">
  <div class="wz">
    <div class="progress" aria-hidden="true"><div class="bar"><i id="barFill"></i></div><span class="stepno" id="stepNo"></span></div>
    <div id="stage" aria-live="polite"></div>
    <p class="hint" style="margin-top:28px">고르신 답은 이 기기에 임시 저장되어, 화면을 닫았다 열어도 이어서 할 수 있습니다. 내돈내가는 셀프 도구 파일럿이며 법률상담·대리를 하지 않습니다.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>FinitArt · 대표 Syn Dae Sik · www.finitart.com · itart@finitart.com · 010-2088-5383</p>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/store.js"></script>
<script>
(function(){
  ND.initTheme();
  var CFG = window.ND_CONFIG || {};
  var KEY = 'naedon-apply-v1';
  var $ = function(id){ return document.getElementById(id); };
  var esc = ND.esc;

  /* ── 질문 정의 ───────────────────────────── */
  var Q = [
    {id:'kind', type:'single', q:'어떤 돈을 못 받으셨나요?', help:'가장 가까운 것을 하나 골라 주세요.', opts:[
      ['goods','물품·납품대금','물건을 팔거나 납품하고 못 받은 돈'],
      ['construction','공사대금','시공·인테리어·하도급 대금'],
      ['service','용역·서비스 대금','디자인, 개발, 운송, 컨설팅 등'],
      ['rent','임대료·관리비','상가·사무실 임대'],
      ['loan','사업상 빌려준 돈','거래처·지인 사업자에게 빌려준 돈'],
      ['judgment','이미 판결·지급명령을 받았는데 못 받음','법원 결정은 있는데 돈이 안 들어옴'],
      ['etc','기타','위에 없는 경우']]},
    {id:'debtor', type:'single', q:'못 준 상대방은 누구인가요?', opts:[
      ['corp','법인 (주식회사 등)'],['sole','개인사업자'],['person','개인 (사업자 아님)'],['unknown','잘 모르겠다']]},
    {id:'amount', type:'single', q:'못 받은 돈은 얼마쯤인가요?', help:'정확하지 않아도 됩니다.', opts:[
      ['a1','500만원 미만'],['a2','500만 ~ 3,000만원'],['a3','3,000만 ~ 1억원'],['a4','1억 ~ 5억원'],['a5','5억원 이상']]},
    {id:'since', type:'single', q:'받기로 한 날부터 얼마나 지났나요?', help:'여러 번 나눠 받기로 했다면 가장 오래된 것을 기준으로 골라 주세요.', opts:[
      ['s1','3개월 이내'],['s2','3개월 ~ 6개월'],['s3','6개월 ~ 1년'],['s4','1년 ~ 2년'],['s5','2년 ~ 3년'],['s6','3년 ~ 5년'],['s7','5년 이상'],['s0','잘 모르겠다']]},
    {id:'evidence', type:'multi', q:'가지고 계신 자료를 모두 골라 주세요.', help:'여러 개 고를 수 있습니다.', none:'none', opts:[
      ['tax','세금계산서'],['stmt','거래명세서·납품확인서'],['contract','계약서·발주서·견적서'],['chat','문자·카톡·메일 대화'],
      ['bank','입금·송금 내역'],['iou','차용증·지불각서'],['court','판결문·지급명령 결정문'],['none','아무것도 없다']]},
    {id:'status', type:'multi', q:'상대방은 지금 어떤 상황인가요?', help:'아는 것만 골라 주세요.', none:'unknown', opts:[
      ['contact','연락은 된다'],['promise','곧 주겠다·나눠 주겠다고 한다'],['dispute','금액이나 품질을 문제 삼는다'],
      ['nocontact','연락을 피하거나 끊겼다'],['closed','폐업했거나 폐업한 것 같다'],['auction','경매·압류·회생·파산 소식이 있다'],
      ['moved','주소·사무실을 옮겼다'],['unknown','잘 모르겠다']]},
    {id:'tried', type:'multi', q:'지금까지 해보신 것을 모두 골라 주세요.', none:'nothing', opts:[
      ['call','전화로 독촉'],['msg','문자·카톡으로 독촉'],['visit','직접 찾아감'],['letter','내용증명 발송'],
      ['order','지급명령 신청'],['suit','소송 제기'],['lawyer','변호사·법무사 상담'],['nothing','아직 아무것도 안 했다']]},
    {id:'hard', type:'multi', q:'가장 막막한 점은 무엇인가요?', help:'파일럿을 개선하는 데 가장 중요한 질문입니다. 여러 개 고를 수 있습니다.', opts:[
      ['start','어디서부터 시작해야 할지 모르겠다'],['docs','서류를 어떻게 써야 할지 모르겠다'],['cost','비용이 얼마나 들지 걱정된다'],
      ['asset','상대방에게 재산이 있는지 모르겠다'],['time','시효가 지났을까 걱정된다'],['proof','증거가 부족한 것 같다'],
      ['busy','일이 바빠 신경 쓸 시간이 없다'],['relation','거래 관계가 끊길까 걱정된다']]},
    {id:'want', type:'single', q:'파일럿에서 어떤 도움을 원하세요?', opts:[
      ['tool','셀프 회수 도구를 직접 써보고 싶다','내용증명·지급명령 초안을 사장님 명의로 직접 작성'],
      ['check','진행 순서 체크리스트만 받고 싶다',''],
      ['monitor','거래처 관리 기능에 관심 있다','앞으로 떼이지 않게 미리 관리'],
      ['look','일단 어떤 서비스인지 알고 싶다','']]},
    {id:'files', type:'files', q:'자료 사진이나 파일을 올려 주세요.', help:'세금계산서, 거래명세서, 대화 캡처 등. 지금 없으면 건너뛰고 나중에 보내셔도 됩니다.'},
    {id:'phone', type:'phone', q:'회신받을 휴대폰 번호를 알려 주세요.', help:'검토 결과를 이 번호로 알려드립니다.'},
    {id:'callTime', type:'single', q:'연락받기 편한 시간은요?', opts:[
      ['am','평일 오전 (9~12시)'],['pm','평일 오후 (13~18시)'],['eve','평일 저녁 (18~20시)'],['sms','전화 말고 문자로만'],['any','아무 때나']]},
    {id:'review', type:'review', q:'마지막으로 확인해 주세요.'}
  ];
  var IDX = {}; Q.forEach(function(s,i){ IDX[s.id]=i; });
  var SHORT = {kind:'받을 돈',debtor:'상대방',amount:'금액',since:'지난 기간',evidence:'가진 자료',status:'상대방 상황',
    tried:'해본 것',hard:'막막한 점',want:'원하는 도움',files:'올린 자료',phone:'휴대폰',callTime:'연락 시간'};

  /* ── 상태 ───────────────────────────── */
  var st = {i:0, a:{}, phone:''}, files = [], sending = false;
  try{ var saved = JSON.parse(sessionStorage.getItem(KEY)||'null'); if(saved && saved.a){ st = saved; } }catch(e){}
  function keep(){ try{ sessionStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

  function label(step, v){ var s=Q[IDX[step]]; for(var i=0;i<s.opts.length;i++) if(s.opts[i][0]===v) return s.opts[i][1]; return v; }
  function labels(step){ var v=st.a[step]; if(v==null) return '-'; return Array.isArray(v) ? (v.length?v.map(function(x){return label(step,x);}).join(', '):'-') : label(step,v); }

  /* 일반 기준 시효 참고 표시 */
  function limitFlag(){
    var k=st.a.kind, s=st.a.since; if(!k||!s||s==='s0') return null;
    var years = {goods:3,construction:3,rent:3,service:5,loan:5,etc:5,judgment:10}[k];
    var range = {s1:[0,.25],s2:[.25,.5],s3:[.5,1],s4:[1,2],s5:[2,3],s6:[3,5],s7:[5,99]}[s];
    if(range[0] >= years) return 'over';
    if(range[1] > years - 0.5) return 'near';
    return null;
  }

  /* ── 렌더 ───────────────────────────── */
  function progress(){
    var n=Q.length; $('barFill').style.width = Math.round((st.i)/(n-1)*100)+'%';
    $('stepNo').textContent = (st.i+1)+' / '+n;
  }
  function head(s){
    return '<h1 class="q" id="qh" tabindex="-1">'+esc(s.q)+'</h1>'+(s.help?'<p class="qhelp">'+esc(s.help)+'</p>':'');
  }
  function navBtns(nextLabel, nextId, allowSkip){
    return '<div class="nav2">'+
      (st.i>0?'<button class="btn" type="button" id="back">← 이전</button>':'')+
      (allowSkip?'<button class="btn" type="button" id="skip">건너뛰기</button>':'')+
      '<button class="btn btn-primary" type="button" id="'+(nextId||'next')+'">'+(nextLabel||'다음 →')+'</button></div>';
  }
  function render(){
    var s=Q[st.i], h='';
    progress();
    if(s.type==='single'||s.type==='multi'){
      var cur=st.a[s.id], multi=s.type==='multi';
      h+=head(s)+'<div class="opts" role="'+(multi?'group':'radiogroup')+'" aria-labelledby="qh">';
      s.opts.forEach(function(o){
        var on = multi ? (Array.isArray(cur)&&cur.indexOf(o[0])>=0) : cur===o[0];
        h+='<button type="button" class="opt '+(multi?'multi':'single')+'" data-v="'+o[0]+'" '+
           (multi?'role="checkbox" aria-checked="'+on+'"':'role="radio" aria-checked="'+on+'"')+'>'+
           '<span class="mk" aria-hidden="true">'+(on?'✓':'')+'</span><span>'+esc(o[1])+(o[2]?'<small>'+esc(o[2])+'</small>':'')+'</span></button>';
      });
      h+='</div>'+(multi?navBtns():(st.i>0?'<div class="nav2"><button class="btn" type="button" id="back">← 이전</button></div>':''));
    } else if(s.type==='files'){
      var maxF=CFG.maxFiles||8, maxMB=CFG.maxTotalMB||20;
      h+=head(s)+'<div class="drop">'+
        '<div class="actions"><label class="btn btn-primary" for="camIn" style="margin:0">📷 사진 찍기</label>'+
        '<label class="btn" for="fileIn" style="margin:0">📁 파일 고르기</label></div>'+
        '<input type="file" id="camIn" accept="image/*" capture="environment" hidden>'+
        '<input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>'+
        '<ul class="filelist" id="flist"></ul>'+
        '<p class="hint" style="margin:0">최대 '+maxF+'개 · 합계 '+maxMB+'MB · 사진·PDF. 사진은 자동으로 크기를 줄여 올립니다. <strong>주민등록번호 뒷자리·계좌번호는 가리고</strong> 찍어 주세요.</p>'+
        '<p class="msg" id="fmsg" role="alert"></p></div>'+navBtns('다음 →','next',true);
    } else if(s.type==='phone'){
      h+=head(s)+'<label for="phoneIn" class="hint">휴대폰 번호 (숫자만)</label>'+
        '<input id="phoneIn" class="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000" value="'+esc(st.phone)+'">'+
        '<p class="msg" id="pmsg" role="alert"></p>'+navBtns();
    } else if(s.type==='review'){
      var lf=limitFlag();
      h+=head(s);
      if(lf) h+='<div class="notice"><strong>'+(lf==='over'?'일반 기준 시효기간이 지났을 수 있습니다.':'일반 기준 시효가 가까울 수 있습니다.')+'</strong> 접수 시 우선 확인 대상으로 표시됩니다. (일반 기준 안내이며 개별 사건의 시효 판단이 아닙니다.)</div>';
      h+='<table class="sum">';
      Q.forEach(function(x,i){
        if(x.type==='review') return;
        var v = x.type==='files' ? (files.length? files.length+'개 첨부':'첨부 없음') : x.type==='phone' ? fmtPhone(st.phone) : labels(x.id);
        h+='<tr><th>'+esc(SHORT[x.id]||x.q)+'</th><td>'+esc(v)+'<br><button type="button" class="btn btn-sm" data-go="'+i+'">고치기</button></td></tr>';
      });
      h+='</table>'+
        '<div class="checks" style="margin-top:18px">'+
        '<button type="button" class="opt multi" id="c1" role="checkbox" aria-checked="'+(!!st.c1)+'"><span class="mk" aria-hidden="true">'+(st.c1?'✓':'')+'</span><span>[필수] 개인정보 수집·이용에 동의합니다<small>수집: 휴대폰 번호, 위 답변, 올린 자료 · 목적: 파일럿 적합성 검토와 회신 · 보관: 회신 후 6개월(요청 시 즉시 삭제) · 저장: Google 드라이브(Google LLC, 국외 서버에 저장될 수 있음) · 거부 시 검토가 어렵습니다</small></span></button>'+
        '<button type="button" class="opt multi" id="c2" role="checkbox" aria-checked="'+(!!st.c2)+'" style="margin-top:12px"><span class="mk" aria-hidden="true">'+(st.c2?'✓':'')+'</span><span>[필수] 법률상담·대리가 아니라 셀프 도구 파일럿임을 이해했습니다<small>회신은 ① 파일럿 참여 가능 ② 변호사 상담 권장 ③ 이번 대상 아님 중 하나로 드립니다.</small></span></button>'+
        '</div><input type="text" id="hp" name="company_site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">'+
        '<p class="msg" id="rmsg" role="alert"></p>'+navBtns(CFG.endpoint?'신청하기':'신청 내용 보내기','submit');
    }
    $('stage').innerHTML = h;
    var qh=$('qh'); if(qh) qh.focus({preventScroll:true});
    window.scrollTo({top:0, behavior:'smooth'});
    bind(s);
  }

  /* ── 동작 ───────────────────────────── */
  function go(n){ st.i = Math.max(0, Math.min(Q.length-1, n)); keep(); render(); }
  function next(){ go(st.i+1); }
  function bind(s){
    var b=$('back'); if(b) b.onclick=function(){ go(st.i-1); };
    if(s.type==='single'){
      Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(el){
        el.onclick=function(){ st.a[s.id]=el.getAttribute('data-v'); keep(); render(); setTimeout(next, 180); };
      });
    } else if(s.type==='multi'){
      Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(el){
        el.onclick=function(){
          var v=el.getAttribute('data-v'), cur=Array.isArray(st.a[s.id])?st.a[s.id].slice():[];
          var at=cur.indexOf(v);
          if(at>=0) cur.splice(at,1); else { if(s.none && v===s.none) cur=[]; else if(s.none) cur=cur.filter(function(x){return x!==s.none;}); cur.push(v); }
          st.a[s.id]=cur; keep(); render();
        };
      });
      $('next').onclick=function(){
        if(!Array.isArray(st.a[s.id])||!st.a[s.id].length){ flash('하나 이상 골라 주세요.'); return; }
        next();
      };
    } else if(s.type==='files'){
      drawFiles();
      $('fileIn').onchange=function(){ addFiles(this.files); this.value=''; };
      $('camIn').onchange=function(){ addFiles(this.files); this.value=''; };
      $('next').onclick=next; $('skip').onclick=next;
    } else if(s.type==='phone'){
      var p=$('phoneIn');
      p.oninput=function(){ var d=p.value.replace(/\D/g,'').slice(0,11); p.value=fmtPhone(d); st.phone=d; keep(); };
      p.onkeydown=function(e){ if(e.key==='Enter') $('next').click(); };
      $('next').onclick=function(){
        if(!/^01[016789]\d{7,8}$/.test(st.phone)){ var m=$('pmsg'); m.className='msg err'; m.textContent='휴대폰 번호를 확인해 주세요. (예: 010-1234-5678)'; p.focus(); return; }
        next();
      };
    } else if(s.type==='review'){
      Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(el){ el.onclick=function(){ go(+el.getAttribute('data-go')); }; });
      ['c1','c2'].forEach(function(id){ $(id).onclick=function(){ st[id]=!st[id]; keep(); render(); }; });
      $('submit').onclick=submit;
    }
  }
  function flash(t){ var n=document.querySelector('.nav2'); var m=document.createElement('p'); m.className='msg err'; m.setAttribute('role','alert'); m.textContent=t; n.parentNode.insertBefore(m,n); setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); },3000); }
  function fmtPhone(d){ d=String(d||'').replace(/\D/g,''); if(d.length<4) return d; if(d.length<8) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4); }

  /* ── 파일 ───────────────────────────── */
  function totalBytes(){ return files.reduce(function(s,f){ return s+f.size; },0); }
  function mb(b){ return (b/1048576).toFixed(1)+'MB'; }
  function drawFiles(){
    var ul=$('flist'); if(!ul) return;
    ul.innerHTML = files.length ? files.map(function(f,i){
      return '<li><span>'+esc(f.name)+' · '+mb(f.size)+'</span><button type="button" class="btn btn-sm btn-danger" data-rm="'+i+'" aria-label="'+esc(f.name)+' 빼기">빼기</button></li>';
    }).join('') + '<li><span><strong>합계 '+files.length+'개 · '+mb(totalBytes())+'</strong></span></li>' : '';
    Array.prototype.forEach.call(ul.querySelectorAll('[data-rm]'),function(b){ b.onclick=function(){ files.splice(+b.getAttribute('data-rm'),1); drawFiles(); }; });
  }
  function shrink(file){
    return new Promise(function(res){
      if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900*1024) return res(file);
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        var max=2000, w=img.naturalWidth, h=img.naturalHeight, r=Math.min(1, max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*r); c.height=Math.round(h*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){
          if(!b || b.size>=file.size) return res(file);
          res(new File([b], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}));
        },'image/jpeg',0.82);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
      img.src=url;
    });
  }
  function addFiles(list){
    var m=$('fmsg'), maxF=CFG.maxFiles||8, maxB=(CFG.maxTotalMB||20)*1048576;
    var arr=Array.prototype.slice.call(list||[]);
    m.className='msg'; m.textContent=arr.length?'사진 크기를 줄이는 중...':'';
    Promise.all(arr.map(shrink)).then(function(out){
      var skipped=[];
      out.forEach(function(f){
        if(!/^image\/|^application\/pdf$/.test(f.type)){ skipped.push(f.name+' (사진·PDF만 가능)'); return; }
        if(files.length>=maxF){ skipped.push(f.name+' (최대 '+maxF+'개)'); return; }
        if(totalBytes()+f.size>maxB){ skipped.push(f.name+' (합계 '+(CFG.maxTotalMB||20)+'MB 초과)'); return; }
        files.push(f);
      });
      drawFiles();
      if(skipped.length){ m.className='msg err'; m.textContent='올리지 못한 파일: '+skipped.join(', '); }
      else { m.className='msg ok'; m.textContent=out.length?out.length+'개를 추가했습니다.':''; }
    });
  }
  function toB64(f){
    return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]||''); }; r.onerror=rej; r.readAsDataURL(f); });
  }

  /* ── 제출 ───────────────────────────── */
  function summaryText(id){
    var lf=limitFlag();
    return ['■ 내돈내가 파일럿 신청'+(id?' ('+id+')':''),'',
      '연락처: '+fmtPhone(st.phone)+' / 연락 시간: '+labels('callTime'),
      '받을 돈: '+labels('kind'),'상대방: '+labels('debtor'),'금액: '+labels('amount'),'경과: '+labels('since')+(lf?(lf==='over'?' [시효 경과 가능]':' [시효 임박 가능]'):''),
      '자료: '+labels('evidence'),'상대방 상황: '+labels('status'),'해본 것: '+labels('tried'),'막막한 점: '+labels('hard'),'원하는 도움: '+labels('want'),
      '첨부: '+(files.length?files.length+'개':'없음'),'','[동의] 개인정보 수집·이용 / 셀프 도구 파일럿임을 이해함'].join('\n');
  }
  function submit(){
    var m=$('rmsg');
    if(!st.c1||!st.c2){ m.className='msg err'; m.textContent='필수 확인 두 개를 눌러 주세요.'; return; }
    for(var i=0;i<Q.length;i++){ var s=Q[i];
      if((s.type==='single'||s.type==='multi') && (st.a[s.id]==null || (Array.isArray(st.a[s.id])&&!st.a[s.id].length)) && s.id!=='hard'){
        m.className='msg err'; m.textContent='「'+s.q+'」에 아직 답하지 않으셨습니다.'; return; }
    }
    if(!/^01[016789]\d{7,8}$/.test(st.phone)){ m.className='msg err'; m.textContent='휴대폰 번호를 확인해 주세요.'; return; }
    if(sending) return;
    var lf=limitFlag();
    if(!CFG.endpoint){ return mailFallback(); }
    sending=true; var btn=$('submit'); btn.disabled=true;
    m.className='msg sending'; m.textContent=files.length?'자료를 올리는 중입니다. 화면을 닫지 마세요...':'보내는 중...';
    Promise.all(files.map(function(f){ return toB64(f).then(function(d){ return {name:f.name,type:f.type,data:d}; }); }))
    .then(function(fs){
      var payload={v:1, hp:($('hp')||{}).value||'', phone:st.phone, callTime:labels('callTime'), limit:lf||'',
        answers:{kind:labels('kind'),debtor:labels('debtor'),amount:labels('amount'),since:labels('since'),evidence:labels('evidence'),
          status:labels('status'),tried:labels('tried'),hard:labels('hard'),want:labels('want')},
        files:fs, page:location.href, ua:navigator.userAgent.slice(0,160)};
      return fetch(CFG.endpoint,{method:'POST', body:JSON.stringify(payload)});
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j||!j.ok) throw new Error((j&&j.error)||'접수 실패');
      try{ sessionStorage.removeItem(KEY); }catch(e){}
      done(j.id);
    })
    .catch(function(err){
      sending=false; btn.disabled=false;
      m.className='msg err';
      m.innerHTML='보내지 못했습니다 ('+esc(err.message||err)+'). 잠시 후 다시 눌러 주세요. 계속 안 되면 <a href="#" id="fb">메일로 보내기</a> 또는 '+esc(CFG.phone||'')+'로 문자 주세요.';
      var fb=$('fb'); if(fb) fb.onclick=function(e){ e.preventDefault(); mailFallback(); };
    });
  }
  function mailFallback(){
    var to=CFG.notifyEmail||'itart@finitart.com', lf=limitFlag();
    var subj=(lf?'[시효확인] ':'')+'[내돈내가 파일럿] '+fmtPhone(st.phone)+' - '+labels('kind')+' '+labels('amount');
    var body=summaryText('')+(files.length?'\n\n※ 자료 '+files.length+'개를 이 메일에 직접 첨부해 주세요.':'');
    location.href='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    var m=$('rmsg'); m.className='msg ok'; m.textContent='메일 앱이 열렸습니다.'+(files.length?' 자료 파일을 첨부한 뒤 ':' ')+'「보내기」를 눌러야 접수됩니다.';
  }
  function done(id){
    $('barFill').style.width='100%'; $('stepNo').textContent='접수 완료';
    $('stage').innerHTML='<div class="done"><h1 class="q" id="qh" tabindex="-1">신청이 접수되었습니다</h1>'+
      '<p>접수번호</p><p class="big">'+esc(id||'-')+'</p>'+
      '<p>영업일 3~5일 안에 <strong>'+esc(fmtPhone(st.phone))+'</strong>로 검토 결과를 알려드립니다.<br>자료를 더 보내실 때는 접수번호를 함께 알려 주세요.</p>'+
      '<div class="actions" style="justify-content:center;margin-top:18px"><a class="btn btn-primary" href="monitor.html">거래처 관리 써보기</a><a class="btn" href="index.html">처음으로</a></div></div>';
    $('qh').focus(); files=[];
  }

  render();
})();
</script>
</body>
